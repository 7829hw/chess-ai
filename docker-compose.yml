services:
  chess:
    build:
      context: .
      dockerfile: Dockerfile
    image: stockfish-chess:latest
    container_name: stockfish-chess
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
