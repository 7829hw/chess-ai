# Server block for the static Stockfish chess app.
# Copied to /etc/nginx/conf.d/default.conf by the Dockerfile.
#
# Cross-Origin isolation (COOP/COEP) is deliberately NOT enabled here.
# This app ships the *single-threaded* Stockfish build
# (stockfish-18-lite-single.js / .wasm), which never touches
# SharedArrayBuffer or WASM threads, so the following headers are not
# required. Enable them only if you swap in a multi-threaded build:
#
#     add_header Cross-Origin-Opener-Policy   same-origin   always;
#     add_header Cross-Origin-Embedder-Policy require-corp  always;
#
# (With require-corp every subresource must also send
#  Cross-Origin-Resource-Policy, which is why we avoid it when unnecessary.)

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    charset_types text/html text/css text/javascript application/javascript
                  application/json image/svg+xml text/plain;

    # ---------------------------------------------------------------- compression
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/javascript application/javascript
                    application/json image/svg+xml application/wasm;
    # Prefer the *.gz files generated during the image build.
    gzip_static     on;

    add_header X-Content-Type-Options nosniff    always;
    add_header Referrer-Policy        no-referrer always;

    # ------------------------------------------------------------------- app shell
    # Never cache the HTML: it references the module graph and the worker URL.
    location = / {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
    }

    # ------------------------------------------------------------------ JavaScript
    # Covers the ES modules, chess.js and the Stockfish Web Worker script.
    # `types { }` + `default_type` scopes the MIME override to this location only,
    # so the inherited mime.types mapping is not clobbered for other files.
    # "no-cache" forces revalidation, which prevents a stale Worker script from
    # being resurrected out of the browser cache after a rebuild.
    location ~* \.m?js$ {
        types { }
        default_type text/javascript;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.css$ {
        types { }
        default_type text/css;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
    }

    # ----------------------------------------------------------------- WebAssembly
    # application/wasm is mandatory for WebAssembly.instantiateStreaming().
    # The engine binary is versioned by filename, so it may be cached hard.
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Self-hosted chess-glyph font subset; already Brotli-compressed internally.
    location ~* \.woff2$ {
        types { }
        default_type font/woff2;
        gzip off;
        gzip_static off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:svg|png|ico)$ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # ---------------------------------------------------------------------- static
    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
